image boot.vfat {
	vfat {
		files = {
			"boot.bin",
			"u-boot.bin",
			"boot.scr",
		}
	}
	size = 16M
}

image sdcard.img {
	hdimage {
		align = 1M
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
